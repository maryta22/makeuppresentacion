schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: Tocador, un tutorial de maquillaje en vivo. HTML, CSS y JavaScript sin
  frameworks ni dependencias. Cada paso de la rutina vive en src/pasos/<id>.js y
  sigue el contrato descrito en AGENTS.md. El avatar se maquilla con la API de
  src/avatar.js (capas y efectos); no se edita el SVG para agregar un paso.

rules:
  proposal:
    - Un cambio agrega o modifica un solo paso de la rutina, o una sola funcionalidad
    - Cada paso nuevo es una capacidad nueva llamada paso-<id> (por ejemplo, paso-labial)
    - Indica qué queda fuera del alcance
  specs:
    - Si el paso cambia según el tipo de piel o el tono, escribe un escenario por cada caso
  tasks:
    - Cada tarea indica cómo se verifica (un test o algo visible en el avatar)
    - Para un paso nuevo, crea solo src/pasos/<id>.js y su test; no edites otros pasos
    - Los pasos de maquillaje aplican su producto con avatar.difuminar dentro de aplicar; no dibujes ni animes nada nuevo

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
